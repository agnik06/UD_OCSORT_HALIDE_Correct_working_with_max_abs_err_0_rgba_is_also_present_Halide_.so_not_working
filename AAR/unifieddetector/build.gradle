apply plugin: 'com.android.library'

archivesBaseName = 'unifieddetector_v1.0.1'

android {
    namespace 'vizinsight.atl.unifieddetector'
    compileSdk 34

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        exclude 'META-INF/com/android/build/gradle/aar-metadata.properties'
    }

    defaultConfig {
        minSdk 24
        targetSdk 34
        //versionCode 1
        versionName "_v1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    aaptOptions {
        noCompress 'es'
    }

    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

task deleteJar(type: Delete) {
    delete 'libs/jars/unifieddetector_v1.0.0.jar'
}

task createJar(type: Copy) {
    from 'build/intermediates/aar_main_jar/release/'
    into('libs/jars')
    include('classes.jar')
    rename('classes.jar', 'unifieddetector_v1.0.1.jar')

}

createJar.dependsOn(deleteJar, build)